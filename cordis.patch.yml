# dsh-treekeeper bundle patch: one loader row mounts the host half.
# The package manifest's `dsh.client` declaration makes client-modules serve
# lib/client.js as the browser module for this row automatically (no separate
# dsh.client row needed). The host half registers the
# /dsh-treekeeper/api JSON route on the webserver.
- insert:
    - id: treekeeper
      name: dsh-treekeeper
