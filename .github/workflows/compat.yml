name: compat

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  # A pull request is where a compatibility break can still be fixed before it
  # ships. The schedule only reports the break after the fact, on the branch
  # everyone builds from, so it is the backstop and not the gate.
  pull_request:
  push:
    branches: [main, dev]

# One run per branch: a burst of commits cancels the superseded runs instead
# of queueing a full boot-check behind each of them. The same group key serves a
# pull request, whose ref is the merge ref.
concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the `engines.node` floor and the only version here a user may be
        # stuck on; 24 is the version development and the other jobs in this
        # repository run on, so it is what a release is actually cut against. The
        # floor has been stated in package.json without ever being executed, which
        # is how a `structuredClone` or a newer `fs/promises` call lands in a
        # release.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: install development dependencies
        # Not `npm ci`: this repository ships no lockfile on purpose (see
        # .gitignore — pinning devDependency tarballs would say nothing about the
        # published library). `--ignore-scripts` keeps a dependency's lifecycle
        # hooks from running in a job that only inspects this tree.
        run: npm install --ignore-scripts
      - name: lib syntax
        # Every file in lib/, not the two entry points: the guard gates, the
        # sampler and the history store are where the Windows-only logic lives,
        # and a syntax error in any of them used to reach a runner untouched.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(lib/*.js)
          if [ "${#files[@]}" -eq 0 ]; then echo '::error::no file matched lib/*.js' >&2; exit 1; fi
          for file in "${files[@]}"; do
            node --check "$file"
          done
          echo "checked ${#files[@]} files under lib/"
      - name: host module exports a DSH plugin
        run: |
          node --input-type=module -e "import('./lib/index.js').then(m => { if (!m.default || typeof m.default.apply !== 'function') { console.error('missing default plugin'); process.exit(1) } })"
      - name: unit tests
        run: npm test
      - name: package contents
        run: npm pack --dry-run
      - name: manifest consistency
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.dsh.bundle.patch) { Write-Error 'dsh.bundle.patch missing' }
          if ($pkg.dsh.client.platform -ne 'web') { Write-Error 'dsh.client.platform must be web' }
          $client = Get-Content lib/client.js -Raw
          if ($client -notmatch [regex]::Escape("id: '$($pkg.name)'")) { Write-Error 'client bundle id does not match package name' }
          $patch = Get-Content cordis.patch.yml -Raw
          if ($patch -notmatch [regex]::Escape($pkg.name)) { Write-Error 'patch does not mount this package' }
          $shared = Get-Content lib/shared.js -Raw
          if ($shared -notmatch [regex]::Escape("VERSION = '$($pkg.version)'")) { Write-Error 'lib/shared.js VERSION does not match package version' }

  # The shared host fragments are verified locally by `npm test`, which runs
  # loopback:check / guard:check / http:check against the pinned dock version. A
  # cross-repo comparison is not run here: its property cannot hold while a peer
  # checkout resolves to a different branch. `dsh-plugin-parity` (from the dock)
  # stays available as a manual diagnostic for when every checkout shares a
  # branch.
  boot-check:
    # The two matrix cells are not the same inspection, and the name says so:
    # this plugin's product is a Windows process tree, so the Linux cell proves
    # routing, the deployed fence and the documented unsupported-platform answer
    # — it cannot prove sampling, attribution, or any kill gate firing on real
    # processes. Those run here only on Windows, plus the unit suite (which
    # covers the gates on both platforms through their injected seams).
    name: >-
      boot DSH Web with bundle (${{ matrix.os }}, dsh${{ matrix.dsh-spec }},
      ${{ matrix.os == 'windows-latest' && 'full: sampler + kill gates' || 'partial: routing + fence + platform verdict' }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # Cover the declared floor and the 0.1.7 API line, both as anchors that
        # do not move. `@latest` is deliberately not in this matrix: the day the
        # host ships a new version every open branch would go red from a change
        # this repository never made, and a red main stops a release. The moving
        # channel belongs to the scheduled run's own judgement, not to a gate that
        # has to stay green to mean anything.
        dsh-spec: ['@0.1.5-rc.3', '@0.1.7-rc.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - name: install development dependencies
        run: npm install --ignore-scripts
      # The Windows cell is the only place the Windows-only logic actually runs,
      # so the unit suite runs here too — as a check of the real platform, not as
      # a repeat of the static job. It must pass without touching a process: the
      # sampler and the kill gates are driven through their injected seams.
      - name: unit tests on the platform this plugin samples
        if: runner.os == 'Windows'
        run: npm test
      - name: install DSH
        run: npm i -g "@deepseek-ai/dsh${{ matrix.dsh-spec }}"
      - name: register bundle into a temporary profile
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:DSH_HOME\profiles\web\node_modules" | Out-Null
          $src = (Get-Location).Path
          New-Item -ItemType Junction -Path "$env:DSH_HOME\profiles\web\node_modules\dsh-treekeeper" -Target $src | Out-Null
          $profileJson = @'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": { "profile": { "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-treekeeper"] } }
          }
          '@ | ConvertFrom-Json | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$env:DSH_HOME\profiles\web\package.json", $profileJson, (New-Object System.Text.UTF8Encoding($false)))
      - name: register bundle into a temporary profile (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dshhome
        run: |
          set -euo pipefail
          mkdir -p "$DSH_HOME/profiles/web/node_modules"
          ln -s "$GITHUB_WORKSPACE" "$DSH_HOME/profiles/web/node_modules/dsh-treekeeper"
          printf '%s\n' '{"name":"dsh-profile-web","private":true,"dependencies":{},"dsh":{"profile":{"bundles":["@deepseek-ai/dsh-base","@deepseek-ai/dsh-web-app","dsh-treekeeper"]}}}' > "$DSH_HOME/profiles/web/package.json"
      - name: boot and verify TreeKeeper
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          # The launch token is a credential: it opens this host as the browser
          # that holds it. Dumping the host log on a failure is the point — a red
          # run has to be diagnosable — so the token line goes before the log ever
          # reaches the job output.
          function Show-HostLog([string]$path) {
            if (-not (Test-Path $path)) { return }
            Get-Content $path -ErrorAction SilentlyContinue |
              Where-Object { $_ -notmatch 'token=' } |
              ForEach-Object { Write-Host $_ }
          }
          $globalRoot = (& npm root -g).Trim()
          $dshBin = Join-Path $globalRoot '@deepseek-ai\dsh\lib\bin.js'
          if (-not (Test-Path $dshBin)) { throw "dsh bin not found at $dshBin" }
          $launchOut = Join-Path $env:RUNNER_TEMP 'dsh-launch.out.log'
          $launchErr = Join-Path $env:RUNNER_TEMP 'dsh-launch.err.log'
          $process = Start-Process -FilePath (Get-Command node).Source -ArgumentList "`"$dshBin`"", '--profile', 'web', '--no-open', '--port', '3129' -RedirectStandardOutput $launchOut -RedirectStandardError $launchErr -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              & curl.exe -s --noproxy '*' --max-time 2 -o NUL 'http://127.0.0.1:3129/'
              if ($LASTEXITCODE -eq 0) { $ready = $true; break }
              if ($process.HasExited) { break }
            }
            if (-not $ready) {
              Write-Host '--- dsh stdout ---'
              Show-HostLog $launchOut
              Write-Host '--- dsh stderr ---'
              Show-HostLog $launchErr
              throw 'dsh web did not become ready'
            }

            $cookieJar = Join-Path $env:RUNNER_TEMP 'dsh-cookies.txt'
            $shellFile = Join-Path $env:RUNNER_TEMP 'dsh-shell.html'
            $shellReady = $false
            $tokenAnnounced = $false
            $shellCode = '000'
            for ($i = 0; $i -lt 15 -and -not $shellReady; $i++) {
              $launchText = [string](Get-Content $launchOut -Raw -ErrorAction SilentlyContinue) + [string](Get-Content $launchErr -Raw -ErrorAction SilentlyContinue)
              $token = [regex]::Match($launchText, '[?&]token=([^&\s\)]+)').Groups[1].Value
              $launchUrl = 'http://127.0.0.1:3129/'
              if ($token) {
                $tokenAnnounced = $true
                $launchUrl += "?token=$token"
              }
              $shellCode = & curl.exe -sS -L --noproxy '*' -c $cookieJar -b $cookieJar -o $shellFile -w '%{http_code}' $launchUrl
              if ($LASTEXITCODE -eq 0 -and $shellCode -eq '200') { $shellReady = $true; break }
              Start-Sleep -Seconds 1
            }
            if (-not $shellReady) {
              Write-Host '--- dsh stdout ---'
              Show-HostLog $launchOut
              Write-Host '--- dsh stderr ---'
              Show-HostLog $launchErr
              throw "web shell authentication failed: HTTP $shellCode (launch token announced: $tokenAnnounced)"
            }
            $cookieArgs = @('-b', $cookieJar)

            $base = 'http://127.0.0.1:3129/dsh-treekeeper/api'
            $snapshotFile = Join-Path $env:RUNNER_TEMP 'treekeeper-snapshot.json'
            $snapshotCode = & curl.exe -sS --noproxy '*' @cookieArgs -o $snapshotFile -w '%{http_code}' "${base}?action=snapshot"
            if ($LASTEXITCODE -ne 0 -or $snapshotCode -ne '200') { throw "authenticated snapshot failed: HTTP $snapshotCode" }
            $snapshot = Get-Content $snapshotFile -Raw | ConvertFrom-Json
            if (-not $snapshot.ok -or $null -eq $snapshot.processes) { throw 'snapshot returned an unexpected payload' }
            # A real Windows host must sample, and the reply must be bounded: the
            # `no-store` posture on a body of live pids is part of what the plugin
            # promises, and is now the dock's fragment rather than this file's.
            $snapshotHeaders = & curl.exe -sS --noproxy '*' @cookieArgs -D - -o NUL "${base}?action=snapshot"
            if (-not ($snapshotHeaders -match '(?i)^cache-control:.*no-store')) {
              throw 'snapshot reply lost cache-control: no-store'
            }
            $shellHtml = Get-Content $shellFile -Raw
            $advertised = [regex]::Match($shellHtml, '["''](/?plugins/[^"'']*dsh-treekeeper/client\.js[^"'']*)["'']')
            if (-not $advertised.Success) { throw 'shell did not advertise the client bundle' }
            $bundlePath = [System.Net.WebUtility]::HtmlDecode($advertised.Groups[1].Value)
            if (-not $bundlePath.StartsWith('/')) { $bundlePath = "/$bundlePath" }
            $clientCode = & curl.exe -s -o NUL -w '%{http_code}' --noproxy '*' @cookieArgs "http://127.0.0.1:3129$bundlePath"
            if ($clientCode -ne '200') { throw "advertised client bundle failed: HTTP $clientCode ($bundlePath)" }

            function ApiCode([string]$method, [string]$url, [string[]]$curlArgs = @()) {
              & curl.exe -s -o NUL -w '%{http_code}' --noproxy '*' -X $method @cookieArgs @curlArgs $url
            }
            if ((ApiCode GET "${base}?action=kill") -ne '405') { throw 'guard regression: GET kill must be 405' }
            # The three header checks below assert the DEPLOYED request fence, not this plugin's
            # own embedded guard: a host that mounts the Connection service fences with its
            # Host/Origin rule plus the signed browser cookie, and the embedded guard only
            # runs where no Connection service is mounted. Keep them as end-to-end assertions
            # of the boundary a caller actually reaches; the guard itself is covered by the
            # unit tests (and, for the no-Connection route, by the route-level test).

            if ((ApiCode POST "${base}?action=kill" @('-H', 'Origin: https://evil.example', '-d', '{"pid":1,"seenCreatedMs":1}')) -ne '403') { throw 'the deployed API must reject a foreign Origin (403)' }
            if ((ApiCode GET "${base}?action=snapshot" @('-H', 'sec-fetch-site: cross-site')) -ne '403') { throw 'the deployed API must reject a cross-site request (403)' }
            if ((ApiCode GET "${base}?action=snapshot" @('-H', 'Host: rebound.example')) -ne '403') { throw 'the deployed API must reject a rebound Host (403)' }
            if ((ApiCode GET "${base}?action=not-real") -ne '400') { throw 'unknown action must be 400' }
            # The kill body contract, end to end: a body that is not JSON is a bad
            # request, and must not be reported as a stale snapshot.
            $badBodyFile = Join-Path $env:RUNNER_TEMP 'treekeeper-bad-body.json'
            $badBodyCode = & curl.exe -sS --noproxy '*' @cookieArgs -X POST -H 'content-type: application/json' -d '{"pid":' -o $badBodyFile -w '%{http_code}' "${base}?action=kill"
            if ($badBodyCode -ne '400') { throw "a malformed kill body must be 400, got $badBodyCode" }
            $badBodyText = Get-Content $badBodyFile -Raw
            if ($badBodyText -notmatch '"code":\s*"bad_json"') { throw "a malformed kill body must answer bad_json, got $badBodyText" }
            Write-Host 'compat check passed'
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: boot and verify TreeKeeper (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DSH_HOME: ${{ runner.temp }}/dshhome
        run: |
          set -euo pipefail
          dsh_bin="$(npm root -g)/@deepseek-ai/dsh/lib/bin.js"
          node "$dsh_bin" --profile web --no-open --port 3129 > "$RUNNER_TEMP/dsh.log" 2>&1 &
          dsh_pid=$!
          trap 'kill "$dsh_pid" 2>/dev/null || true' EXIT
          # Same reason as the Windows cell: the launch token is a credential, and
          # this prints the whole host log into the job output on a failure.
          print_dsh_log() {
            local found=false log_file bytes error_types
            if kill -0 "$dsh_pid" 2>/dev/null; then
              echo 'dsh process: alive' >&2
            else
              echo 'dsh process: exited' >&2
            fi
            for log_file in "$RUNNER_TEMP/dsh.log" "$DSH_HOME"/launcher/logs/server-3129.*.log; do
              [ -f "$log_file" ] || continue
              found=true
              bytes=$(wc -c < "$log_file" | tr -d ' ')
              printf 'dsh log file: %s (%s bytes)\n' "${log_file##*/}" "$bytes" >&2
              grep -v 'token=' "$log_file" >&2 || true
              error_types=$(grep -Eo '(TypeError|ReferenceError|SyntaxError|RangeError|EvalError|URIError|Error):' "$log_file" | sort -u | tr '\n' ' ' || true)
              [ -z "$error_types" ] || printf 'dsh error types: %s\n' "$error_types" >&2
            done
            if [ "$found" = false ]; then
              echo 'no DSH log files found in the runner temp or launcher log directory' >&2
            fi
            if [ -f "$shell_html" ]; then
              echo 'client bundle paths in returned HTML:' >&2
              grep -oE '/plugins/[A-Za-z0-9_./@+-]*client\.js' "$shell_html" | sort -u >&2 || true
            fi
          }
          ready=false
          for _ in $(seq 1 60); do
            if curl --noproxy '*' -sS --max-time 2 -o /dev/null http://127.0.0.1:3129/; then ready=true; break; fi
            sleep 1
          done
          if ! $ready; then
            print_dsh_log
            exit 1
          fi
          cookie_jar="$RUNNER_TEMP/dsh-cookies.txt"
          shell_html="$RUNNER_TEMP/dsh-shell.html"
          shell_ready=0
          token_announced=0
          shell_code=000
          for _ in $(seq 1 15); do
            token=$(sed -n 's/.*[?&]token=\([^&[:space:])]*\).*/\1/p' "$RUNNER_TEMP/dsh.log" | tail -n 1)
            launch_url='http://127.0.0.1:3129/'
            if [ -n "$token" ]; then launch_url="${launch_url}?token=${token}"; token_announced=1; fi
            shell_code=$(curl -sS -L --noproxy '*' -c "$cookie_jar" -b "$cookie_jar" -o "$shell_html" -w '%{http_code}' "$launch_url" || true)
            [ "$shell_code" = 200 ] && { shell_ready=1; break; }
            sleep 1
          done
          [ "$shell_ready" = 1 ] || { echo "::error::web shell authentication failed: HTTP $shell_code (launch token announced: $token_announced)"; print_dsh_log; exit 1; }
          cookie_args=(-b "$cookie_jar")
          base='http://127.0.0.1:3129/dsh-treekeeper/api'
          snapshot_file="$RUNNER_TEMP/treekeeper-snapshot.json"
          snapshot_code=$(curl --noproxy '*' "${cookie_args[@]}" -sS -o "$snapshot_file" -w '%{http_code}' "${base}?action=snapshot" || true)
          # Linux has no process sampler, and saying so is the documented product
          # behavior (AGENTS.md: report the platform limit, do not add an
          # unverified sampler). The reply is the fixed code, not the exception
          # text: the raw cause now goes to the host log. What this cell therefore
          # does NOT cover is anything downstream of sampling — attribution,
          # findings, the kill gates against live processes, taskkill itself. Those
          # are the Windows cell and the injected-seam unit tests.
          [ "$snapshot_code" = 500 ] || { echo "::error::Linux snapshot should report unsupported sampling, got HTTP $snapshot_code"; cat "$snapshot_file" 2>/dev/null || true; exit 1; }
          grep -q '"ok":false' "$snapshot_file" || { echo '::error::Linux snapshot failure payload is malformed'; exit 1; }
          grep -q '"code":"unsupported_platform"' "$snapshot_file" || { echo '::error::Linux snapshot did not answer the documented platform code'; cat "$snapshot_file"; exit 1; }
          grep -q 'process sampling is only implemented on Windows' "$snapshot_file" || { echo '::error::Linux snapshot did not state the documented platform limit'; cat "$snapshot_file"; exit 1; }
          # The three checks the Windows cell states as its strong coverage, ported
          # because they hold on either platform: they are decided before anything
          # that samples a process.
          [ "$(curl --noproxy '*' "${cookie_args[@]}" -s -o /dev/null -w '%{http_code}' "${base}?action=not-real")" = 400 ]
          [ "$(curl --noproxy '*' "${cookie_args[@]}" -s -o /dev/null -w '%{http_code}' "${base}?action=kill")" = 405 ]
          [ "$(curl --noproxy '*' "${cookie_args[@]}" -s -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' "${base}?action=snapshot")" = 403 ]
          [ "$(curl --noproxy '*' "${cookie_args[@]}" -s -o /dev/null -w '%{http_code}' -H 'sec-fetch-site: cross-site' "${base}?action=snapshot")" = 403 ]
          [ "$(curl --noproxy '*' "${cookie_args[@]}" -s -o /dev/null -w '%{http_code}' -H 'Host: rebound.example' "${base}?action=snapshot")" = 403 ]
          # 0.1.7 advertises the roster entry as `plugins/??<name>/client.js&rev=…`
          # — no leading slash, and the preload list packs every name into one
          # `??` URL. Excluding the comma from the prefix keeps that combined URL
          # from matching; the per-entry URL is the one that can be fetched.
          bundle_path=$(grep -oE '/?plugins/[^"< ,]*dsh-treekeeper/client\.js[^"< ]*' "$shell_html" | head -n 1 | sed 's/&amp;/\&/g' || true)
          if [ -z "$bundle_path" ]; then
            echo '::error::shell did not advertise the dsh-treekeeper client bundle' >&2
            print_dsh_log
            exit 1
          fi
          case "$bundle_path" in /*) ;; *) bundle_path="/$bundle_path" ;; esac
          bundle_code=$(curl --noproxy '*' "${cookie_args[@]}" -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3129$bundle_path" || true)
          if [ "$bundle_code" != 200 ]; then
            echo "::error::advertised client bundle failed: HTTP $bundle_code ($bundle_path)" >&2
            print_dsh_log
            exit 1
          fi
          echo 'Ubuntu boot check passed (Windows-only sampler intentionally not exercised)'
